<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quivro</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Quivro is a trivia party game by Nightfall Studio. A host starts a round on this website, and players join with a code on their phones. Sign in with Google saves a Quivro Pro purchase to your account."
    />
    <link rel="icon" href="/favicon.ico?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=5" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('quivro.theme');
          if (t !== 'dark' && t !== 'light') {
            t =
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
